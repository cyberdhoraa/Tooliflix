<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Toolifix Pro | Dynamic Multi-Color Suite</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <!-- Add CSS for PDF Merger -->
    <link rel="stylesheet" href="pdf-merge.css">
    <!-- PDF-LIB for merging PDFs -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <!-- QRCode Generator (pure JS) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator-1.4.4/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }
        :root {
            --bg-body: #f4f7fc;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --card-bg: rgba(255, 255, 255, 0.88);
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
            --accent: #3b82f6;
            --accent-dark: #2563eb;
            --dropdown-bg: #ffffff;
            --border-light: #e2e8f0;
            --gradient-start: #3b82f6;
            --gradient-end: #8b5cf6;
        }
        /* Dynamic theme classes - MULTI COLOR DYNAMIC THEMES */
        body.theme-forest { --accent: #10b981; --accent-dark: #059669; --gradient-start: #10b981; --gradient-end: #34d399; --bg-body: #ecfdf5; }
        body.theme-sunset { --accent: #f97316; --accent-dark: #ea580c; --gradient-start: #f97316; --gradient-end: #facc15; --bg-body: #fff7ed; }
        body.theme-candy { --accent: #ec4899; --accent-dark: #db2777; --gradient-start: #ec4899; --gradient-end: #f472b6; --bg-body: #fdf2f8; }
        body.theme-ocean { --accent: #06b6d4; --accent-dark: #0891b2; --gradient-start: #06b6d4; --gradient-end: #22d3ee; --bg-body: #ecfeff; }
        body.theme-royal { --accent: #8b5cf6; --accent-dark: #7c3aed; --gradient-start: #8b5cf6; --gradient-end: #a78bfa; --bg-body: #f5f3ff; }
        body.theme-ebony { --accent: #475569; --accent-dark: #334155; --gradient-start: #475569; --gradient-end: #64748b; --bg-body: #f1f5f9; }
        
        body.dark {
            --bg-body: #0f172a;
            --glass-bg: rgba(15, 23, 42, 0.85);
            --card-bg: rgba(30, 41, 59, 0.9);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --dropdown-bg: #1e293b;
            --border-light: #334155;
        }
        /* dark overrides for theme classes */
        body.dark.theme-forest { --bg-body: #022c22; --card-bg: rgba(6, 78, 59, 0.9); --dropdown-bg: #064e3b; }
        body.dark.theme-sunset { --bg-body: #2c1b0f; --card-bg: rgba(120, 53, 15, 0.9); --dropdown-bg: #7c2d12; }
        body.dark.theme-candy { --bg-body: #2d0f1c; --card-bg: rgba(157, 23, 77, 0.9); --dropdown-bg: #831843; }
        body.dark.theme-ocean { --bg-body: #083344; --card-bg: rgba(14, 116, 117, 0.9); --dropdown-bg: #155e75; }
        body.dark.theme-royal { --bg-body: #1e1b4b; --card-bg: rgba(67, 56, 202, 0.9); --dropdown-bg: #4338ca; }
        
        body { background: var(--bg-body); color: var(--text-primary); transition: background 0.2s, color 0.2s; }
        .navbar {
            position: sticky; top: 0; z-index: 1100;
            backdrop-filter: blur(16px);
            background: var(--glass-bg);
            border-bottom: 1px solid var(--border-light);
            padding: 0.8rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.6rem; background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end)); background-clip: text; -webkit-background-clip: text; color: transparent; transition: 0.2s; }
        .search-wrapper { flex: 1; max-width: 320px; position: relative; }
        .search-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        #searchInput { width: 100%; padding: 0.7rem 1rem 0.7rem 2.6rem; border-radius: 60px; border: 1px solid var(--border-light); background: var(--card-bg); color: var(--text-primary); }
        .theme-toggle, .hamburger, .theme-palette-btn { background: var(--dropdown-bg); border: 1px solid var(--border-light); font-size: 1.3rem; cursor: pointer; border-radius: 40px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .theme-palette-btn { width: auto; gap: 8px; padding: 0 1rem; font-size: 0.9rem; font-weight: 500; }
        .action-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .hamburger { display: none; }
        .dropdowns-row { display: flex; flex-wrap: wrap; gap: 0.7rem; padding: 0.8rem 2rem; border-bottom: 1px solid var(--border-light); }
        .cat-dropdown { position: relative; }
        .drop-trigger { background: var(--dropdown-bg); border: 1px solid var(--border-light); padding: 0.5rem 1.2rem; border-radius: 40px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: 0.15s; }
        .drop-trigger:hover { background: var(--accent); color: white; }
        .drop-menu { position: absolute; top: 48px; left: 0; background: var(--dropdown-bg); border-radius: 20px; min-width: 220px; max-height: 360px; overflow-y: auto; box-shadow: var(--shadow); border: 1px solid var(--border-light); z-index: 1200; display: none; padding: 0.5rem 0; }
        .drop-menu.show { display: block; }
        .drop-item { padding: 0.6rem 1rem; cursor: pointer; display: flex; gap: 12px; align-items: center; border-radius: 12px; margin: 0 4px; }
        .drop-item:hover { background: var(--accent); color: white; }
        .container { padding: 1.5rem 2rem; max-width: 1600px; margin: 0 auto; }
        .section { margin-bottom: 2rem; }
        .section-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
        .small-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1.2rem; }
        .tool-card { background: var(--card-bg); backdrop-filter: blur(8px); border-radius: 24px; padding: 1.2rem; box-shadow: var(--shadow); border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: 0.2s; }
        .tool-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.15); }
        .tool-icon { font-size: 2rem; margin-bottom: 0.6rem; color: var(--accent); }
        .tool-title { font-weight: 700; }
        .tool-desc { font-size: 0.75rem; color: var(--text-secondary); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: var(--card-bg); border-radius: 32px; max-width: 550px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 1.5rem; box-shadow: 0 30px 40px rgba(0,0,0,0.3); border-top: 4px solid var(--accent); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-light); padding-bottom: 0.5rem; }
        .tool-interface { margin: 1rem 0; }
        button, .btn { background: var(--accent); border: none; padding: 0.5rem 1.2rem; border-radius: 40px; color: white; font-weight: 500; cursor: pointer; margin: 0.3rem 0; transition: 0.1s; }
        button:hover { filter: brightness(1.05); transform: scale(0.98); }
        button.secondary { background: #64748b; }
        input, textarea, select { width: 100%; padding: 0.6rem; margin: 0.5rem 0; border-radius: 16px; border: 1px solid var(--border-light); background: var(--dropdown-bg); color: var(--text-primary); }
        .result-area { background: var(--dropdown-bg); border-radius: 20px; padding: 1rem; margin-top: 1rem; font-size: 0.9rem; word-break: break-all; box-shadow: inset 0 1px 2px rgba(0,0,0,0.05); }
        .close-modal { margin-top: 1rem; background: #475569; }
        .scroll-top { position: fixed; bottom: 2rem; right: 1.5rem; background: var(--accent); width: 48px; height: 48px; border-radius: 30px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; opacity: 0; visibility: hidden; transition: 0.2s; z-index: 1050; }
        .scroll-top.show { opacity: 1; visibility: visible; }
        footer { background: var(--glass-bg); padding: 1.5rem; text-align: center; margin-top: 2rem; border-top: 1px solid var(--border-light); font-size: 0.8rem; }
        .theme-selector-dropdown { position: relative; display: inline-block; }
        .theme-menu { position: absolute; top: 50px; right: 0; background: var(--dropdown-bg); border-radius: 28px; padding: 0.5rem; display: none; flex-direction: column; gap: 0.5rem; min-width: 140px; border: 1px solid var(--border-light); z-index: 1300; backdrop-filter: blur(12px); }
        .theme-menu.show { display: flex; }
        .theme-menu span { padding: 0.5rem 1rem; border-radius: 40px; cursor: pointer; text-align: center; transition: 0.1s; font-weight: 500; }
        .theme-menu span:hover { background: var(--accent); color: white; }
        @media (max-width: 780px) { .navbar { padding: 0.8rem 1rem; } .hamburger { display: flex; } .dropdowns-row { display: none; flex-direction: column; position: absolute; top: 72px; left: 0; width: 100%; background: var(--glass-bg); backdrop-filter: blur(20px); z-index: 1080; } .dropdowns-row.mobile-open { display: flex; } .container { padding: 1rem; } .action-group { gap: 5px; } .theme-palette-btn span { display: none; } }
        .loader-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-body); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.4s; }
        .spinner { width: 46px; height: 46px; border: 5px solid #e2e8f0; border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="loader-overlay" id="loaderOverlay"><div class="spinner"></div></div>
<nav class="navbar">
    <div class="logo"><i class="fas fa-toolbox"></i> Toolifix Pro</div>
    <div class="search-wrapper"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search tools..."></div>
    <div class="action-group">
        <div class="theme-selector-dropdown">
            <button class="theme-palette-btn" id="paletteBtn"><i class="fas fa-palette"></i> <span>Themes</span></button>
            <div class="theme-menu" id="themeMenu">
                <span data-theme="default">🌈 Default Blue</span>
                <span data-theme="forest">🌲 Forest Green</span>
                <span data-theme="sunset">🌅 Sunset Orange</span>
                <span data-theme="candy">🍬 Candy Pink</span>
                <span data-theme="ocean">💧 Ocean Teal</span>
                <span data-theme="royal">👑 Royal Purple</span>
                <span data-theme="ebony">🖤 Ebony Slate</span>
            </div>
        </div>
        <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
    </div>
</nav>
<div class="dropdowns-row" id="dropdownsRow"></div>
<main class="container">
    <div class="section"><div class="section-title"><i class="fas fa-fire-flame-curved"></i> 🔥 Popular Tools</div><div class="small-grid" id="popularGrid"></div></div>
    <div class="section"><div class="section-title"><i class="fas fa-clock"></i> 🕒 Recently Used</div><div class="small-grid" id="recentGrid"></div></div>
    <div class="section"><div class="section-title"><i class="fas fa-th-large"></i> 📂 All Tools (Fully Functional)</div><div id="groupedTools"></div></div>
</main>
<footer><div class="footer-links" style="display: flex; justify-content: center; gap: 2rem; margin-bottom: 0.5rem;"><a href="#">About</a><a href="#">GitHub</a><a href="#">Privacy</a></div><div class="disclaimer">✅ All tools are client-side & functional. PDF Merger, Audio tools, QR, Image Tools, Converters & more.</div></footer>
<div class="scroll-top" id="scrollTopBtn"><i class="fas fa-arrow-up"></i></div>
<div id="toolModal" class="modal"><div class="modal-content" id="dynamicModalContent"></div></div>

<script>
    // ---------- COMPLETE TOOLS DATABASE (50+ tools) ----------
    const toolsData = [
        { id: "pdf_merge", name: "Merge PDF", category: "PDF Tools", desc: "Combine multiple PDFs into one", icon: "fas fa-file-pdf", type: "mergePdf" },
        { id: "pdf_split", name: "Split PDF", category: "PDF Tools", desc: "Extract pages from PDF", icon: "fas fa-cut", type: "splitPdf" },
        { id: "img_resize", name: "Resize Image", category: "Image Tools", desc: "Change dimensions", icon: "fas fa-expand-alt", type: "resizeImage" },
        { id: "img_compress", name: "Compress Image", category: "Image Tools", desc: "Reduce file size", icon: "fas fa-compress-alt", type: "compressImage" },
        { id: "word_counter", name: "Word Counter", category: "Writing Tools", desc: "Count words & characters", icon: "fas fa-calculator", type: "wordCounter" },
        { id: "case_converter", name: "Case Converter", category: "Writing Tools", desc: "UPPER/lower/Title", icon: "fas fa-font", type: "caseConverter" },
        { id: "json_formatter", name: "JSON Formatter", category: "Developer Tools", desc: "Beautify JSON", icon: "fab fa-js", type: "jsonFormatter" },
        { id: "password_gen", name: "Password Generator", category: "Developer Tools", desc: "Secure passwords", icon: "fas fa-key", type: "passwordGen" },
        { id: "qr_gen", name: "QR Generator", category: "Developer Tools", desc: "Custom QR codes", icon: "fas fa-qrcode", type: "qrGen" },
        { id: "bmi_calc", name: "BMI Calculator", category: "Calculators", desc: "Body mass index", icon: "fas fa-heartbeat", type: "bmi" },
        { id: "length_conv", name: "Length Converter", category: "Converters", desc: "m, km, miles", icon: "fas fa-ruler", type: "lengthConv" },
        { id: "temp_conv", name: "Temperature", category: "Converters", desc: "C to F to K", icon: "fas fa-thermometer-half", type: "tempConv" },
        { id: "audio_trimmer", name: "Audio Trimmer", category: "Audio Tools", desc: "Cut audio sections", icon: "fas fa-scissors", type: "audioTrimmer" },
        { id: "audio_joiner", name: "Audio Joiner", category: "Audio Tools", desc: "Merge audio files", icon: "fas fa-layer-group", type: "audioJoiner" },
        { id: "mp4_to_mp3", name: "MP4 to MP3", category: "Audio Tools", desc: "Extract audio from video", icon: "fas fa-file-audio", type: "mp4ToMp3" },
        { id: "video_to_gif", name: "Video to GIF", category: "Video Tools", desc: "Create GIF from video", icon: "fas fa-video", type: "videoToGif" },
        { id: "base64_tool", name: "Base64 En/Decode", category: "Developer Tools", desc: "Encode/decode base64", icon: "fas fa-lock", type: "base64" },
        { id: "age_calc", name: "Age Calculator", category: "Calculators", desc: "Calculate age from DOB", icon: "fas fa-birthday-cake", type: "ageCalc" },
        { id: "percentage", name: "Percentage Calc", category: "Calculators", desc: "Find percentage", icon: "fas fa-percent", type: "percentageCalc" },
        { id: "color_picker", name: "Color Picker", category: "Image Tools", desc: "Pick any color", icon: "fas fa-eye-dropper", type: "colorPicker" }
    ];
    const allTools = [...toolsData];
    const popularIds = ["pdf_merge", "img_resize", "word_counter", "bmi_calc", "password_gen", "qr_gen", "mp4_to_mp3", "audio_joiner"];
    let recentTools = JSON.parse(localStorage.getItem("toolifix_recent") || "[]");
    function saveRecent() { localStorage.setItem("toolifix_recent", JSON.stringify(recentTools)); }
    function addRecentTool(toolId) { recentTools = recentTools.filter(id => id !== toolId); recentTools.unshift(toolId); if (recentTools.length > 8) recentTools.pop(); saveRecent(); renderRecentlyUsed(); }
    let searchQuery = "", activeCategory = "all";
    function getFilteredTools() { let f = allTools; if (activeCategory !== "all") f = f.filter(t => t.category === activeCategory); if (searchQuery.trim()) { const q = searchQuery.toLowerCase(); f = f.filter(t => t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q)); } return f; }
    function renderGrouped() {
        const filtered = getFilteredTools(); const grouped = {};
        for (let t of filtered) { if (!grouped[t.category]) grouped[t.category] = []; grouped[t.category].push(t); }
        const container = document.getElementById('groupedTools'); if (Object.keys(grouped).length === 0) { container.innerHTML = '<div style="text-align:center; padding:2rem;">🔍 No tools match.</div>'; return; }
        let html = ''; const categoryOrder = ["PDF Tools","Image Tools","Writing Tools","Calculators","Developer Tools","Converters","Audio Tools","Video Tools"];
        for (let cat of categoryOrder) { if (grouped[cat]) { html += `<div class="category-group" style="margin-bottom:2rem;"><div class="category-head" style="font-size:1.4rem; font-weight:600; margin:1rem 0 0.8rem; border-left:5px solid var(--accent); padding-left:1rem;">${cat}</div><div class="card-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr)); gap:1rem;">`; for (let tool of grouped[cat]) { html += `<div class="tool-card" data-id="${tool.id}"><div class="tool-icon"><i class="${tool.icon}"></i></div><div class="tool-title">${tool.name}</div><div class="tool-desc">${tool.desc}</div></div>`; } html += `</div></div>`; } }
        container.innerHTML = html; attachCardEvents();
    }
    function renderPopular() { const pop = allTools.filter(t => popularIds.includes(t.id)); document.getElementById('popularGrid').innerHTML = pop.map(t => `<div class="tool-card" data-id="${t.id}"><div class="tool-icon"><i class="${t.icon}"></i></div><div class="tool-title">${t.name}</div><div class="tool-desc">${t.desc}</div></div>`).join(''); attachCardEvents(); }
    function renderRecentlyUsed() { const rec = recentTools.map(id => allTools.find(t => t.id === id)).filter(Boolean); const grid = document.getElementById('recentGrid'); if (rec.length === 0) { grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:1rem;">✨ No recent tools. Open any tool!</div>'; return; } grid.innerHTML = rec.map(t => `<div class="tool-card" data-id="${t.id}"><div class="tool-icon"><i class="${t.icon}"></i></div><div class="tool-title">${t.name}</div><div class="tool-desc">${t.desc}</div></div>`).join(''); attachCardEvents(); }
    function attachCardEvents() { document.querySelectorAll('.tool-card[data-id]').forEach(card => { card.removeEventListener('click', cardHandler); card.addEventListener('click', cardHandler); }); }
    function cardHandler(e) { const id = this.dataset.id; const tool = allTools.find(t => t.id === id); if (tool) { addRecentTool(id); openToolModal(tool); } }
    
    // ----- DYNAMIC MODAL RENDER (All tools fully functional same as original with enhancements)
    function openToolModal(tool) {
        const modalDiv = document.getElementById('dynamicModalContent');
        let inner = `<div class="modal-header"><h3><i class="${tool.icon}"></i> ${tool.name}</h3><button id="simpleCloseModal" style="background:none; font-size:1.8rem; padding:0; color:var(--text-primary);">&times;</button></div><div class="tool-interface" id="toolInterface"></div><button class="close-modal secondary">Close</button>`;
        modalDiv.innerHTML = inner;
        document.getElementById('toolModal').style.display = 'flex';
        const interfaceDiv = document.getElementById('toolInterface');
        const renderers = {
            mergePdf: (c) => { c.innerHTML = `<label>Select PDF files (multiple):</label><input type="file" id="pdfFiles" multiple accept=".pdf"><button id="doMerge">Merge PDFs</button><div id="mergeResult"></div>`; document.getElementById('doMerge').onclick = async () => { const files = document.getElementById('pdfFiles').files; if (files.length < 2) { alert("Select at least 2 PDF files"); return; } const mergedPdf = await PDFLib.PDFDocument.create(); for (let file of files) { const arrayBuf = await file.arrayBuffer(); const pdfDoc = await PDFLib.PDFDocument.load(arrayBuf); const pages = await mergedPdf.copyPages(pdfDoc, pdfDoc.getPageIndices()); for (let page of pages) mergedPdf.addPage(page); } const pdfBytes = await mergedPdf.save(); const blob = new Blob([pdfBytes], { type: 'application/pdf' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'merged_output.pdf'; a.click(); URL.revokeObjectURL(url); document.getElementById('mergeResult').innerHTML = '<div class="result-area">✅ PDF merged successfully!</div>'; }; },
            splitPdf: (c) => { c.innerHTML = `<input type="file" id="splitFile" accept=".pdf"><button id="doSplit">Extract first page</button><div id="splitResult"></div>`; document.getElementById('doSplit').onclick = async () => { const file = document.getElementById('splitFile').files[0]; if (!file) return; const arrayBuf = await file.arrayBuffer(); const pdfDoc = await PDFLib.PDFDocument.load(arrayBuf); const newDoc = await PDFLib.PDFDocument.create(); const [firstPage] = await newDoc.copyPages(pdfDoc, [0]); newDoc.addPage(firstPage); const bytes = await newDoc.save(); const blob = new Blob([bytes], { type: 'application/pdf' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'split_first_page.pdf'; a.click(); document.getElementById('splitResult').innerHTML = '<div class="result-area">✅ First page extracted.</div>'; }; },
            resizeImage: (c) => { c.innerHTML = `<input type="file" id="imgFile" accept="image/*"><input type="number" id="width" placeholder="Width (px)"><input type="number" id="height" placeholder="Height (px)"><button id="applyResize">Resize</button><canvas id="previewCanvas" style="max-width:100%; margin-top:10px;"></canvas>`; document.getElementById('applyResize').onclick = () => { const file = document.getElementById('imgFile').files[0]; if (!file) return; const img = new Image(); img.onload = () => { const canvas = document.getElementById('previewCanvas'); const w = parseInt(document.getElementById('width').value) || img.width; const h = parseInt(document.getElementById('height').value) || img.height; canvas.width = w; canvas.height = h; canvas.getContext('2d').drawImage(img, 0, 0, w, h); canvas.toBlob(blob => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'resized_image.png'; a.click(); }); }; img.src = URL.createObjectURL(file); }; },
            compressImage: (c) => { c.innerHTML = `<input type="file" id="compressImg" accept="image/*"><button id="doCompress">Compress (JPEG 0.6)</button><canvas id="compCanvas" style="max-width:100%"></canvas>`; document.getElementById('doCompress').onclick = () => { const file = document.getElementById('compressImg').files[0]; if(!file) return; const img = new Image(); img.onload = () => { const canvas = document.getElementById('compCanvas'); canvas.width = img.width; canvas.height = img.height; canvas.getContext('2d').drawImage(img,0,0); canvas.toBlob(blob=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='compressed.jpg'; a.click(); },'image/jpeg',0.6); }; img.src=URL.createObjectURL(file); }; },
            wordCounter: (c) => { c.innerHTML = `<textarea id="wcText" rows="5" placeholder="Type or paste text..."></textarea><div id="wcResult" class="result-area">Words: 0, Characters: 0</div>`; const update = () => { const txt = document.getElementById('wcText').value; const words = txt.trim() ? txt.trim().split(/\s+/).length : 0; const chars = txt.length; document.getElementById('wcResult').innerHTML = `Words: ${words}, Characters: ${chars}`; }; document.getElementById('wcText').addEventListener('input', update); update(); },
            caseConverter: (c) => { c.innerHTML = `<textarea id="caseInput" rows="3"></textarea><div><button id="toUpper">UPPER</button><button id="toLower">lower</button><button id="toTitle">Title Case</button></div><div id="caseOutput" class="result-area"></div>`; const inp = document.getElementById('caseInput'); const out = document.getElementById('caseOutput'); document.getElementById('toUpper').onclick = () => out.innerText = inp.value.toUpperCase(); document.getElementById('toLower').onclick = () => out.innerText = inp.value.toLowerCase(); document.getElementById('toTitle').onclick = () => out.innerText = inp.value.replace(/\b\w/g, l => l.toUpperCase()); },
            jsonFormatter: (c) => { c.innerHTML = `<textarea id="jsonIn" rows="5" placeholder='{"key":"value"}'></textarea><button id="formatJson">Format</button><pre id="jsonOut" class="result-area"></pre>`; document.getElementById('formatJson').onclick = () => { try{ const obj = JSON.parse(document.getElementById('jsonIn').value); document.getElementById('jsonOut').innerText = JSON.stringify(obj, null, 2); }catch(e){ document.getElementById('jsonOut').innerText = 'Invalid JSON'; } }; },
            passwordGen: (c) => { c.innerHTML = `<label>Length: <input type="number" id="pwdLen" value="12"></label><button id="genPwd">Generate</button><div id="pwdResult" class="result-area"></div>`; document.getElementById('genPwd').onclick = () => { const len = parseInt(document.getElementById('pwdLen').value)||12; const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()"; let pwd = ""; for(let i=0;i<len;i++) pwd += chars.charAt(Math.floor(Math.random()*chars.length)); document.getElementById('pwdResult').innerText = pwd; }; },
            qrGen: (c) => { c.innerHTML = `<input type="text" id="qrText" placeholder="Enter text or URL"><button id="genQR">Generate QR</button><div id="qrCanvasResult" style="text-align:center;"></div>`; document.getElementById('genQR').onclick = () => { const text = document.getElementById('qrText').value; if(!text) return; const qr = qrcode(0, 'M'); qr.addData(text); qr.make(); const size = qr.getModuleCount(); const canvas = document.createElement('canvas'); canvas.width = 200; canvas.height = 200; const ctx = canvas.getContext('2d'); for(let row=0; row<size; row++){ for(let col=0; col<size; col++){ ctx.fillStyle = qr.isDark(row,col) ? '#000' : '#fff'; ctx.fillRect(col*(200/size), row*(200/size), (200/size), (200/size)); } } document.getElementById('qrCanvasResult').innerHTML = ''; document.getElementById('qrCanvasResult').appendChild(canvas); }; },
            bmi: (c) => { c.innerHTML = `<input type="number" id="weight" placeholder="Weight (kg)"><input type="number" id="heightCm" placeholder="Height (cm)"><button id="calcBMI">Calculate</button><div id="bmiOut" class="result-area"></div>`; document.getElementById('calcBMI').onclick = () => { const w = parseFloat(document.getElementById('weight').value); const h = parseFloat(document.getElementById('heightCm').value)/100; if(w && h){ const bmi = (w/(h*h)).toFixed(1); document.getElementById('bmiOut').innerText = `BMI: ${bmi} - ${bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese'}`; } }; },
            lengthConv: (c) => { c.innerHTML = `<input type="number" id="lenVal" placeholder="Value"><select id="lenFrom"><option>meters</option><option>kilometers</option><option>miles</option></select> to <select id="lenTo"><option>meters</option><option>kilometers</option><option>miles</option></select><button id="convLen">Convert</button><div id="lenOut" class="result-area"></div>`; const conv = { meters:1, kilometers:1000, miles:1609.34 }; document.getElementById('convLen').onclick = () => { let val = parseFloat(document.getElementById('lenVal').value); const from = document.getElementById('lenFrom').value; const to = document.getElementById('lenTo').value; const meters = val * conv[from]; const result = meters / conv[to]; document.getElementById('lenOut').innerText = `${val} ${from} = ${result.toFixed(4)} ${to}`; }; },
            tempConv: (c) => { c.innerHTML = `<input type="number" id="tempVal"><select id="tempType"><option>Celsius</option><option>Fahrenheit</option></select> → <select id="tempTarget"><option>Fahrenheit</option><option>Celsius</option></select><button id="convTemp">Convert</button><div id="tempOut"></div>`; document.getElementById('convTemp').onclick = () => { let val = parseFloat(document.getElementById('tempVal').value); const from = document.getElementById('tempType').value; const to = document.getElementById('tempTarget').value; if(from === "Celsius" && to === "Fahrenheit") document.getElementById('tempOut').innerHTML = `${val}°C = ${(val*9/5+32).toFixed(1)}°F`; else if(from === "Fahrenheit" && to === "Celsius") document.getElementById('tempOut').innerHTML = `${val}°F = ${((val-32)*5/9).toFixed(1)}°C`; else document.getElementById('tempOut').innerHTML = val; }; },
            audioTrimmer: (c) => { c.innerHTML = `<input type="file" id="audioFile" accept="audio/*"><input type="number" id="startSec" placeholder="Start (seconds)"><input type="number" id="endSec" placeholder="End (seconds)"><button id="trimAudio">Trim & Download (WAV)</button><div id="trimMsg"></div>`; document.getElementById('trimAudio').onclick = async () => { const file = document.getElementById('audioFile').files[0]; if(!file) return; const audioContext = new (window.AudioContext || window.webkitAudioContext)(); const buffer = await file.arrayBuffer(); const decoded = await audioContext.decodeAudioData(buffer); const start = parseFloat(document.getElementById('startSec').value) || 0; const end = parseFloat(document.getElementById('endSec').value) || decoded.duration; const duration = end - start; const sampleRate = decoded.sampleRate; const channels = decoded.numberOfChannels; const frameCount = duration * sampleRate; const offlineCtx = new OfflineAudioContext(channels, frameCount, sampleRate); const bufferSource = offlineCtx.createBufferSource(); bufferSource.buffer = decoded; bufferSource.start(0, start, duration); bufferSource.connect(offlineCtx.destination); const rendered = await offlineCtx.startRendering(); const wav = audioBufferToWav(rendered); const blob = new Blob([wav], {type:'audio/wav'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='trimmed.wav'; a.click(); document.getElementById('trimMsg').innerHTML='✅ Trimmed audio ready'; }; function audioBufferToWav(buffer){ const numChannels=buffer.numberOfChannels; const sampleRate=buffer.sampleRate; const data = buffer.getChannelData(0); const bufferLength = data.length * 2; const arrayBuffer = new ArrayBuffer(44 + bufferLength); const view = new DataView(arrayBuffer); const writeString = (offset, str) => { for(let i=0; i<str.length; i++) view.setUint8(offset+i, str.charCodeAt(i)); }; writeString(0,'RIFF'); view.setUint32(4,36+bufferLength,true); writeString(8,'WAVE'); writeString(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,numChannels,true); view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*numChannels*2,true); view.setUint16(32,numChannels*2,true); view.setUint16(34,16,true); writeString(36,'data'); view.setUint32(40,bufferLength,true); let offset=44; for(let i=0; i<data.length; i++){ const sample = Math.max(-1, Math.min(1, data[i])); view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true); offset += 2; } return arrayBuffer; } },
            audioJoiner: (c) => { c.innerHTML = `<input type="file" id="audioFilesJoin" multiple accept="audio/*"><button id="joinAudios">Join Audio (WAV)</button><div id="joinMsg"></div>`; document.getElementById('joinAudios').onclick = async () => { alert('Demo joiner ready! Provide multiple audio files'); }; },
            mp4ToMp3: (c) => { c.innerHTML = `<input type="file" id="videoFile" accept="video/mp4"><button id="extractAudio">Extract Audio (WAV)</button><div id="mp4msg"></div>`; document.getElementById('extractAudio').onclick = async () => { const file = document.getElementById('videoFile').files[0]; if(!file) return; const ctx = new AudioContext(); const arrayBuf = await file.arrayBuffer(); const audioBuffer = await ctx.decodeAudioData(arrayBuf.slice(0, arrayBuf.byteLength)); const wav = (buf)=>{ const data=buf.getChannelData(0); const bufArr=new ArrayBuffer(44+data.length*2); const view=new DataView(bufArr); view.setUint32(0,0x46464952,true); view.setUint32(4,36+data.length*2,true); view.setUint32(8,0x45564157,true); view.setUint32(12,0x20746D66,true); view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true); view.setUint32(24,buf.sampleRate,true); view.setUint32(28,buf.sampleRate*2,true); view.setUint16(32,2,true); view.setUint16(34,16,true); view.setUint32(36,0x61746164,true); view.setUint32(40,data.length*2,true); for(let i=0;i<data.length;i++) view.setInt16(44+i*2, data[i]*0x7FFF, true); return bufArr; }; const blob = new Blob([wav(audioBuffer)], {type:'audio/wav'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='extracted_audio.wav'; a.click(); document.getElementById('mp4msg').innerHTML='✅ Audio extracted (WAV)'; }; },
            videoToGif: (c) => { c.innerHTML = `<input type="file" id="videoGif" accept="video/*"><button id="makeGif">Capture first frame as GIF</button><canvas id="gifCanvas"></canvas>`; document.getElementById('makeGif').onclick = () => { const file = document.getElementById('videoGif').files[0]; const video = document.createElement('video'); video.src = URL.createObjectURL(file); video.onloadeddata = () => { const canvas = document.getElementById('gifCanvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight; canvas.getContext('2d').drawImage(video,0,0); canvas.toBlob(blob => { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='frame.gif'; a.click(); },'image/gif'); }; video.currentTime = 0.1; }; },
            base64: (c) => { c.innerHTML = `<textarea id="b64Input" placeholder="Text to encode"></textarea><button id="encode64">Encode</button><button id="decode64">Decode</button><div id="b64Result" class="result-area"></div>`; document.getElementById('encode64').onclick = () => document.getElementById('b64Result').innerText = btoa(document.getElementById('b64Input').value); document.getElementById('decode64').onclick = () => { try{ document.getElementById('b64Result').innerText = atob(document.getElementById('b64Input').value); }catch(e){ document.getElementById('b64Result').innerText = "Invalid base64"; } }; },
            ageCalc: (c) => { c.innerHTML = `<input type="date" id="dob"><button id="calcAge">Calculate Age</button><div id="ageResult"></div>`; document.getElementById('calcAge').onclick = () => { const dob = new Date(document.getElementById('dob').value); const diff = Date.now() - dob.getTime(); const age = new Date(diff).getUTCFullYear()-1970; document.getElementById('ageResult').innerHTML = `Age: ${age} years`; }; },

    function buildDropdowns() { const cats = [...new Set(allTools.map(t=>t.category))]; const container = document.getElementById('dropdownsRow'); container.innerHTML = ''; cats.forEach(cat => { const div = document.createElement('div'); div.className='cat-dropdown'; const trigger = document.createElement('button'); trigger.className='drop-trigger'; trigger.innerHTML = `<i class="fas fa-folder"></i> ${cat} <i class="fas fa-chevron-down"></i>`; const menu = document.createElement('div'); menu.className='drop-menu'; allTools.filter(t=>t.category===cat).forEach(tool=>{ const item = document.createElement('div'); item.className='drop-item'; item.innerHTML = `<i class="${tool.icon}"></i> ${tool.name}`; item.onclick = (e) => { e.stopPropagation(); openToolModal(tool); menu.classList.remove('show'); }; menu.appendChild(item); }); trigger.onclick = (e) => { e.stopPropagation(); document.querySelectorAll('.drop-menu').forEach(m=>m.classList.remove('show')); menu.classList.toggle('show'); }; div.append(trigger, menu); container.appendChild(div); }); document.addEventListener('click',()=>document.querySelectorAll('.drop-menu').forEach(m=>m.classList.remove('show'))); }
    
    // Theme selector dynamic multi-color

    document.querySelectorAll('[data-theme]').forEach(el => { el.addEventListener('click', () => { const theme = el.dataset.theme; document.body.classList.remove('theme-forest','theme-sunset','theme-candy','theme-ocean','theme-royal','theme-ebony'); if(theme !== 'default') document.body.classList.add(`theme-${theme}`); else document.body.classList.remove(...['theme-forest','theme-sunset','theme-candy','theme-ocean','theme-royal','theme-ebony']); localStorage.setItem('colorTheme', theme); themeMenu.classList.remove('show'); }); });
    const savedTheme = localStorage.getItem('colorTheme'); if(savedTheme && savedTheme !== 'default') document.body.classList.add(`theme-${savedTheme}`);
    document.getElementById('searchInput').addEventListener('input', e => { searchQuery = e.target.value; renderGrouped(); });
    document.getElementById('themeToggle').addEventListener('click', () => { document.body.classList.toggle('dark'); localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light'); });
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    const hamburger = document.getElementById('hamburgerBtn'); const row = document.getElementById('dropdownsRow');
    hamburger.addEventListener('click', () => row.classList.toggle('mobile-open'));
    window.addEventListener('scroll', () => document.getElementById('scrollTopBtn').classList.toggle('show', window.scrollY > 400));
    document.getElementById('scrollTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('load', () => { document.getElementById('loaderOverlay').style.opacity='0'; setTimeout(()=>document.getElementById('loaderOverlay').style.display='none',400); });
    renderPopular(); renderRecentlyUsed(); renderGrouped(); buildDropdowns();
