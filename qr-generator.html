<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator-1.4.4/qrcode.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; margin-bottom: 20px; color: #333; }
        textarea, input, select {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover { transform: scale(0.98); }
        .qr-preview {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin: 20px 0;
        }
        .color-row {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .color-row input { flex: 1; height: 50px; }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-group button { margin: 0; }
        .download-btn { background: #28a745; }
        .copy-btn { background: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✨ QR Code Generator</h2>
        
        <textarea id="qrText" rows="3" placeholder="Enter text or URL">https://toolifix.com</textarea>
        
        <div class="color-row">
            <input type="color" id="qrColor" value="#000000">
            <input type="color" id="bgColor" value="#FFFFFF">
        </div>
        
        <select id="qrSize">
            <option value="200">Small (200px)</option>
            <option value="250" selected>Medium (250px)</option>
            <option value="300">Large (300px)</option>
            <option value="400">Extra Large (400px)</option>
        </select>
        
        <button id="generateBtn">🚀 Generate QR Code</button>
        
        <div class="qr-preview" id="qrPreview"></div>
        
        <div class="btn-group">
            <button id="downloadBtn" class="download-btn">💾 Download</button>
            <button id="copyBtn" class="copy-btn">📋 Copy</button>
        </div>
    </div>

    <script>
        let currentCanvas = null;
        
        function generateQR() {
            const text = document.getElementById('qrText').value;
            if (!text) {
                alert('Please enter some text or URL');
                return;
            }
            
            const size = parseInt(document.getElementById('qrSize').value);
            const qrColor = document.getElementById('qrColor').value;
            const bgColor = document.getElementById('bgColor').value;
            
            // Create QR code
            const qr = qrcode(0, 'M');
            qr.addData(text);
            qr.make();
            
            const moduleCount = qr.getModuleCount();
            const cellSize = size / moduleCount;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Draw background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, size, size);
            
            // Draw QR code
            for (let row = 0; row < moduleCount; row++) {
                for (let col = 0; col < moduleCount; col++) {
                    if (qr.isDark(row, col)) {
                        ctx.fillStyle = qrColor;
                        ctx.fillRect(col * cellSize, row * cellSize, cellSize, cellSize);
                    }
                }
            }
            
            // Display
            const preview = document.getElementById('qrPreview');
            preview.innerHTML = '';
            preview.appendChild(canvas);
            currentCanvas = canvas;
        }
        
        function downloadQR() {
            if (!currentCanvas) {
                alert('Generate a QR code first');
                return;
            }
            const link = document.createElement('a');
            link.download = 'qrcode.png';
            link.href = currentCanvas.toDataURL();
            link.click();
        }
        
        async function copyQR() {
            if (!currentCanvas) {
                alert('Generate a QR code first');
                return;
            }
            try {
                const blob = await new Promise(resolve => currentCanvas.toBlob(resolve));
                await navigator.clipboard.write([
                    new ClipboardItem({
                        [blob.type]: blob
                    })
                ]);
                alert('✅ QR Code copied to clipboard!');
            } catch(err) {
                alert('❌ Failed to copy');
            }
        }
        
        // Event listeners
        document.getElementById('generateBtn').onclick = generateQR;
        document.getElementById('downloadBtn').onclick = downloadQR;
        document.getElementById('copyBtn').onclick = copyQR;
        
        // Auto-generate on any change
        document.getElementById('qrText').oninput = generateQR;
        document.getElementById('qrColor').oninput = generateQR;
        document.getElementById('bgColor').oninput = generateQR;
        document.getElementById('qrSize').onchange = generateQR;
        
        // Generate on load
        generateQR();
    </script>
</body>
</html>
